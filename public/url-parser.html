<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onshape URL Parser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            margin-top: 2rem;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .feature-tree {
            margin: 1rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 4px;
            overflow: visible;
        }
        .tree-node {
            position: relative;
            margin: 0.5rem 0;
        }
        .tree-toggle {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0.25rem 0;
            color: #333;
        }
        .tree-toggle:hover {
            color: #0056b3;
        }
        .toggle-icon {
            display: inline-block;
            width: 20px;
            text-align: center;
            margin-right: 5px;
            font-size: 0.8em;
        }
        .feature-name {
            font-weight: 500;
            margin-right: 8px;
        }
        .feature-type {
            color: #666;
            font-size: 0.9em;
            padding-left: .25rem;
        }
        .feature-info {
            margin-left: 25px;
            padding: 0;
            background: #fff;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .detail-section {
            margin: 0;
            border: none;
            border-radius: 4px;
        }
        .detail-toggle {
            padding: 4px 8px;
            background-color: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 4px;
        }
        .detail-toggle:hover {
            background-color: #e9ecef;
        }
        .detail-toggle .toggle-icon {
            margin-right: 8px;
            font-size: 0.8em;
            color: #666;
        }
        .detail-toggle strong {
            margin-right: 8px;
            color: #333;
        }
        .detail-toggle .feature-type {
            color: #666;
            font-size: 0.9em;
        }
        .entities-content,
        .constraints-content,
        .parameters-content,
        .details-content {
            padding: 10px;
            background-color: white;
        }
        .detail-item {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 3px solid #007bff;
            border-radius: 4px;
        }
        .geometry-details {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .geometry-property {
            margin: 8px 0;
            padding: 8px;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        .nested-details {
            margin-left: 20px;
            padding: 10px;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        .control-points,
        .interpolation-points {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .control-point,
        .interpolation-point {
            margin: 5px 0;
            padding: 5px;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        .detail-item strong,
        .geometry-property strong,
        .nested-details strong {
            color: #495057;
            margin-right: 8px;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            margin: 5px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .array-item {
            margin: 5px 0;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .global-toggles {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .global-toggles .btn {
            font-size: 0.9em;
            padding: 0.25rem 0.5rem;
        }
        .global-toggles .btn-outline-primary {
            color: #0d6efd;
            border-color: #0d6efd;
        }
        .global-toggles .btn-outline-primary:hover {
            background-color: #0d6efd;
            color: white;
        }
        .tree-content {
            margin-left: 25px;
            border-left: 1px solid #dee2e6;
            padding-left: 10px;
        }
        .tree-node::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            width: 10px;
            height: 1px;
            background: #dee2e6;
        }
        .tree-node:first-child::before {
            display: none;
        }
        .query-details {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .query-details strong {
            color: #495057;
            margin-right: 8px;
            display: inline-block;
        }
        .query-info {
            margin: 10px 0;
            padding: 10px;
            background-color: #fff;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .referenced-ids {
            margin: 10px 0;
            padding: 10px;
            background-color: #fff;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .referenced-id {
            margin: 5px 0;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
        }
        .referenced-entities-content {
            padding: 10px;
            background-color: white;
        }
        .referenced-entities-content .detail-item {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 3px solid #28a745;
            border-radius: 4px;
        }
        .nested-details {
            margin-left: 20px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        .nested-details strong {
            color: #495057;
            margin-right: 8px;
            display: inline-block;
        }
        .feature-header {
            font-size: 1.1em;
            margin-bottom: 10px;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .json-content {
            padding: 2px 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.2;
            margin-left: 20px;
            border-left: 1px solid #dee2e6;
            width: calc(100% - 20px);
            overflow: visible;
        }
        .json-preview {
            color: #666;
            font-style: italic;
        }
        .json-toggle {
            display: flex;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            padding: 2px 0;
            width: 100%;
        }
        .json-toggle:hover {
            background-color: #e9ecef;
        }
        .json-toggle .toggle-icon {
            width: 20px;
            text-align: center;
            font-size: 0.8em;
            color: #666;
        }
        .json-item {
            padding: 0;
            margin: 0;
            line-height: 1.2;
            display: block;
            width: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-indent: 0;
            min-height: 1.2em;
        }
        .json-key {
            color: #881391;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: inline;
        }
        .json-value {
            color: #1a1aa6;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: inline;
        }
        .json-null {
            color: #666;
        }
        .json-array, .json-object {
            margin: 0;
            width: 100%;
            display: block;
        }
        .feature-info {
            margin: 4px 0;
            padding: 0;
            background: #fff;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .detail-section {
            margin: 0;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Onshape URL Parser</h1>
        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label for="onshapeUrl" class="form-label">Onshape URL</label>
                    <input type="text" class="form-control" id="onshapeUrl" 
                           value="https://cad.onshape.com/documents/cb1e9acdd17540e4f4a4d45b/w/425a72a0620d341664869beb/e/e3e5ef7c62cd21704be0c100"
                           placeholder="Enter Onshape URL">
                </div>
                <button id="parseButton" class="btn btn-primary">Parse URL</button>
            </div>
        </div>
        <div id="loadingSpinner" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="result"></div>
        <div class="global-toggles">
            <button class="btn btn-sm btn-outline-primary" data-section="entities">Entities</button>
            <button class="btn btn-sm btn-outline-primary" data-section="constraints">Constraints</button>
            <button class="btn btn-sm btn-outline-primary" data-section="parameters">Parameters</button>
            <button class="btn btn-sm btn-outline-primary" data-section="all">All</button>
        </div>
    </div>
    <script src="js/url-parser.js"></script>
</body>
</html>
